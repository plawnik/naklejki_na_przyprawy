<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Arkusze etykiet na przyprawy</title>
  <meta name="description" content="Edytor wielostronicowych arkuszy A4 z etykietami kuchennymi, własnymi grafikami i eksportem do PDF.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff4d6' stroke='%23702718' stroke-width='4'/%3E%3Cpath d='M32 48V20M32 31c-8-1-12-5-13-12 8 0 13 4 13 12Zm0 8c8-1 12-5 13-12-8 0-13 4-13 12Z' fill='none' stroke='%233f722d' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #241a17;
      --muted: #736963;
      --line: #ded7d1;
      --paper: #fffdf9;
      --panel: #f7f4ef;
      --accent: #7b2f20;
      --accent-2: #a85d26;
      --green: #35643a;
      --focus: #d88a3d;
      --shadow: 0 14px 42px rgba(51, 36, 29, .12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ebe7e1; color: var(--ink); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 65%, white);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(330px, 390px) 1fr;
    }

    .library-panel {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-right: 1px solid var(--line);
      z-index: 3;
    }

    .library-header { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff4d6;
      border: 2px solid var(--accent);
      color: var(--green);
      flex: 0 0 auto;
    }
    .brand h1 { font-family: Georgia, serif; font-size: 1.22rem; line-height: 1.1; margin: 0; }
    .brand p { color: var(--muted); font-size: .82rem; margin: 4px 0 0; }

    .settings-grid { display: grid; grid-template-columns: 1fr 112px; gap: 10px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: .78rem; font-weight: 700; color: var(--muted); }
    .field input, .field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 11px;
      background: white;
      color: var(--ink);
    }
    .custom-size[hidden] { display: none; }

    .target-note {
      margin-top: 12px;
      border: 1px solid #e4c184;
      border-radius: 10px;
      background: #fff7df;
      padding: 9px 11px;
      font-size: .82rem;
      line-height: 1.35;
      color: #684112;
    }
    .target-note[hidden] { display: none; }

    .import-label-btn { width: 100%; margin-top: 12px; background: #fffaf0; border-color: #dfbd83; color: #6c3d13; }
    .import-label-btn:hover { border-color: #ba7a31; background: #fff5df; }

    .catalog-tools {
      padding: 14px 22px 12px;
      display: grid;
      grid-template-columns: 1fr 122px;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-wrap input, .catalog-tools select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .search-wrap input { padding: 0 10px 0 35px; }
    .catalog-tools select { padding: 0 8px; font-size: .84rem; }

    .catalog {
      overflow: auto;
      padding: 14px 14px 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
    }
    .label-card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      padding: 9px;
      display: grid;
      grid-template-columns: 58px 1fr;
      align-items: center;
      gap: 9px;
      min-height: 78px;
      text-align: left;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .label-card:hover { transform: translateY(-1px); border-color: #c89d79; box-shadow: 0 5px 15px rgba(77, 50, 35, .09); }
    .label-card img { width: 58px; height: 58px; border-radius: 50%; display: block; object-fit: cover; }
    .label-card strong { font-size: .78rem; line-height: 1.18; display: block; }
    .label-card small { display: block; margin-top: 5px; color: var(--accent); font-size: .71rem; font-weight: 800; }
    .usage-badge {
      position: absolute; top: 6px; right: 6px; min-width: 24px; height: 24px; padding: 0 6px;
      display: grid; place-items: center; border-radius: 999px; background: var(--accent); color: #fff;
      border: 2px solid #fff; box-shadow: 0 2px 8px rgba(72, 28, 18, .22); font-size: .7rem; font-weight: 900;
    }
    .catalog-empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 36px 10px; }

    .workspace { min-width: 0; padding: 22px clamp(16px, 3vw, 42px) 64px; }
    .workspace-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -22px calc(clamp(16px, 3vw, 42px) * -1) 22px;
      padding: 15px clamp(16px, 3vw, 42px);
      background: rgba(235, 231, 225, .92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(105, 91, 82, .14);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .workspace-title h2 { margin: 0; font-size: 1.05rem; }
    .workspace-title p { margin: 3px 0 0; color: var(--muted); font-size: .82rem; }
    .toolbar-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 0 14px;
      background: white;
      font-weight: 750;
      font-size: .86rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn:hover { border-color: #b79f90; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: #632417; }
    .btn.danger { color: #982d24; border-color: #e6c2bd; background: #fff8f7; }
    .btn:disabled { opacity: .55; cursor: wait; }

    .pages { display: grid; gap: 28px; max-width: 760px; margin: 0 auto; }
    .page-card { background: rgba(255,255,255,.56); border: 1px solid #d8d1ca; border-radius: 18px; padding: 14px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .page-header h3 { font-size: .93rem; margin: 0; }
    .page-header span { color: var(--muted); font-size: .78rem; }
    .page-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: #fff;
      display: grid; place-items: center; cursor: pointer; color: var(--muted);
    }
    .icon-btn:hover { color: #9e2b22; border-color: #d9aaa3; }
    .paper-wrap { display: flex; justify-content: center; overflow: hidden; }
    .paper {
      position: relative;
      width: min(100%, 560px);
      aspect-ratio: 210 / 297;
      background: white;
      box-shadow: var(--shadow);
      border: 1px solid #d2cbc4;
      overflow: hidden;
    }
    .slot {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed #c9beb4;
      background: rgba(245, 240, 234, .46);
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      overflow: hidden;
      transition: box-shadow .12s ease, border-color .12s ease, background .12s ease;
    }
    .slot:hover { border-color: var(--focus); background: rgba(255, 238, 194, .45); }
    .slot.active { box-shadow: 0 0 0 3px #f0a755; border-color: #a95717; }
    .slot img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 50%; }
    .slot-number { color: #a99d92; font-size: clamp(7px, 1.1vw, 11px); line-height: 1; }
    .slot-plus { display: block; font-size: clamp(10px, 1.4vw, 16px); line-height: .8; color: #a99d92; }

    .page-summary { margin-top: 12px; border-top: 1px solid #ded7d1; padding-top: 10px; }
    .page-summary summary { cursor: pointer; font-size: .8rem; font-weight: 750; color: #5f544e; }
    .page-summary p { margin: 8px 0 0; font-size: .78rem; line-height: 1.55; color: var(--muted); }
    .empty-summary { font-style: italic; }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 20; background: rgba(28,20,16,.48); display: grid; place-items: center; padding: 20px;
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: min(430px, 100%); background: var(--paper); border-radius: 20px; box-shadow: 0 28px 80px rgba(24,15,10,.3);
      padding: 22px;
    }
    .modal-top { display: flex; justify-content: flex-end; }
    .modal-content { text-align: center; }
    .modal-content img { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 25px rgba(57,35,22,.14); }
    .modal-content h3 { margin: 14px 0 5px; font-family: Georgia, serif; font-size: 1.32rem; }
    .modal-content p { margin: 0; color: var(--muted); font-size: .84rem; }
    .modal-actions { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    .crop-modal { width: min(520px, 100%); }
    .crop-modal h3 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 1.3rem; }
    .crop-modal > p { margin: 0 0 16px; color: var(--muted); font-size: .84rem; line-height: 1.4; }
    .crop-stage {
      width: min(100%, 410px); aspect-ratio: 1; margin: 0 auto; border-radius: 14px; overflow: hidden;
      background: #d8d1c9; border: 1px solid var(--line); cursor: grab; touch-action: none; user-select: none;
    }
    .crop-stage.dragging { cursor: grabbing; }
    .crop-stage canvas { width: 100%; height: 100%; display: block; }
    .crop-controls { margin-top: 15px; display: grid; gap: 12px; }
    .crop-controls input[type="text"] { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 11px; }
    .zoom-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; color: var(--muted); font-size: .78rem; font-weight: 750; }
    .zoom-row input { width: 100%; accent-color: var(--accent); }

    .toast {
      position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      padding: 11px 16px; border-radius: 12px; background: #251a16; color: white; font-size: .84rem;
      box-shadow: 0 12px 36px rgba(0,0,0,.24); opacity: 0; pointer-events: none; transition: .18s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 1fr; }
      .library-panel { position: relative; height: auto; max-height: 58vh; border-right: 0; border-bottom: 1px solid var(--line); }
      .catalog { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .workspace-toolbar { position: relative; margin-top: -22px; }
    }
    @media (max-width: 620px) {
      .catalog { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace-toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-actions { width: 100%; justify-content: stretch; }
      .toolbar-actions .btn { flex: 1; }
      .page-card { padding: 10px; border-radius: 13px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="library-panel" aria-label="Biblioteka etykiet">
      <div class="library-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M12 21V4m0 8c-5-.5-7.5-3-8-7 5 0 8 2.5 8 7Zm0 5c5-.5 7.5-3 8-7-5 0-8 2.5-8 7Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div><h1>Etykiety na przyprawy</h1><p>38 wzorów testowych · arkusze A4 · PDF</p></div>
        </div>
        <div class="settings-grid">
          <div class="field">
            <label for="sizePreset">Średnica naklejki</label>
            <select id="sizePreset">
              <option value="22">22 mm</option>
              <option value="30" selected>30 mm</option>
              <option value="40">40 mm</option>
              <option value="50">50 mm</option>
              <option value="60">60 mm</option>
              <option value="80">80 mm</option>
              <option value="custom">Własna</option>
            </select>
          </div>
          <div class="field custom-size" id="customSizeField" hidden>
            <label for="customSize">Rozmiar [mm]</label>
            <input id="customSize" type="number" min="15" max="80" step="0.5" value="35" inputmode="decimal">
          </div>
          <div class="field" id="layoutInfoField">
            <label>Układ strony</label>
            <div id="layoutInfo" style="min-height:42px;border:1px solid var(--line);border-radius:10px;background:#f8f6f2;padding:10px 9px;font-size:.8rem;font-weight:750"></div>
          </div>
        </div>
        <div class="target-note" id="targetNote" hidden></div>
        <button class="btn import-label-btn" id="importImageBtn" type="button">Dodaj własną etykietę z pliku</button>
        <input id="imageFileInput" type="file" accept="image/*" hidden>
      </div>

      <div class="catalog-tools">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Szukaj przyprawy" aria-label="Szukaj przyprawy">
        </div>
        <select id="categoryFilter" aria-label="Filtruj grupę etykiet"></select>
      </div>
      <div class="catalog" id="catalog"></div>
    </aside>

    <section class="workspace" aria-label="Podgląd stron A4">
      <header class="workspace-toolbar">
        <div class="workspace-title">
          <h2>Strony do wydruku</h2>
          <p id="workspaceStats">1 strona · 0 etykiet</p>
        </div>
        <div class="toolbar-actions">
          <button class="btn" id="addPageBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Dodaj stronę
          </button>
          <button class="btn primary" id="exportBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Pobierz PDF
          </button>
        </div>
      </header>
      <div class="pages" id="pages"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top"><button class="icon-btn" id="closeModalBtn" type="button" aria-label="Zamknij">×</button></div>
      <div class="modal-content">
        <img id="modalImage" alt="">
        <h3 id="modalTitle"></h3>
        <p id="modalPosition"></p>
      </div>
      <div class="modal-actions">
        <button class="btn" id="replaceBtn" type="button">Zmień etykietę</button>
        <button class="btn danger" id="removeBtn" type="button">Usuń z pola</button>
      </div>
    </section>
  </div>
  <div class="modal-backdrop" id="importModal" hidden>
    <section class="modal crop-modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="modal-top"><button class="icon-btn" id="closeImportBtn" type="button" aria-label="Zamknij">×</button></div>
      <h3 id="importModalTitle">Własna etykieta</h3>
      <p>Przeciągnij obraz, aby ustawić kadr w kole. Suwakiem zmienisz jego skalę.</p>
      <div class="crop-stage" id="cropStage"><canvas id="cropCanvas" width="820" height="820"></canvas></div>
      <div class="crop-controls">
        <div class="field">
          <label for="customLabelName">Nazwa etykiety</label>
          <input id="customLabelName" type="text" maxlength="80" placeholder="Np. moja mieszanka">
        </div>
        <label class="zoom-row" for="cropZoom"><span>Skala</span><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"><output id="cropZoomValue">100%</output></label>
      </div>
      <div class="modal-actions">
        <button class="btn" id="cancelImportBtn" type="button">Anuluj</button>
        <button class="btn primary" id="confirmImportBtn" type="button">Dodaj etykietę</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/labels.js"></script>
  <script>
    const LABELS = window.LABELS || [];

    const A4 = { width: 210, height: 297, margin: 10, gap: 3 };
    const labelMap = new Map(LABELS.map(label => [label.id, label]));
    const imageCache = new Map();
    const state = {
      size: 30,
      pages: [],
      activeTarget: null,
      editingTarget: null,
      search: '',
      category: 'Wszystkie'
    };
    const cropState = {
      image: null,
      objectUrl: null,
      zoom: 1,
      offsetX: 0,
      offsetY: 0,
      dragStart: null
    };

    const els = {
      catalog: document.querySelector('#catalog'),
      pages: document.querySelector('#pages'),
      sizePreset: document.querySelector('#sizePreset'),
      customSize: document.querySelector('#customSize'),
      customSizeField: document.querySelector('#customSizeField'),
      layoutInfoField: document.querySelector('#layoutInfoField'),
      layoutInfo: document.querySelector('#layoutInfo'),
      searchInput: document.querySelector('#searchInput'),
      categoryFilter: document.querySelector('#categoryFilter'),
      addPageBtn: document.querySelector('#addPageBtn'),
      exportBtn: document.querySelector('#exportBtn'),
      workspaceStats: document.querySelector('#workspaceStats'),
      targetNote: document.querySelector('#targetNote'),
      editModal: document.querySelector('#editModal'),
      closeModalBtn: document.querySelector('#closeModalBtn'),
      modalImage: document.querySelector('#modalImage'),
      modalTitle: document.querySelector('#modalTitle'),
      modalPosition: document.querySelector('#modalPosition'),
      replaceBtn: document.querySelector('#replaceBtn'),
      removeBtn: document.querySelector('#removeBtn'),
      importImageBtn: document.querySelector('#importImageBtn'),
      imageFileInput: document.querySelector('#imageFileInput'),
      importModal: document.querySelector('#importModal'),
      closeImportBtn: document.querySelector('#closeImportBtn'),
      cancelImportBtn: document.querySelector('#cancelImportBtn'),
      confirmImportBtn: document.querySelector('#confirmImportBtn'),
      customLabelName: document.querySelector('#customLabelName'),
      cropStage: document.querySelector('#cropStage'),
      cropCanvas: document.querySelector('#cropCanvas'),
      cropZoom: document.querySelector('#cropZoom'),
      cropZoomValue: document.querySelector('#cropZoomValue'),
      toast: document.querySelector('#toast')
    };

    function calculateLayout(size = state.size) {
      const usableWidth = A4.width - 2 * A4.margin;
      const usableHeight = A4.height - 2 * A4.margin;
      const columns = Math.max(1, Math.floor((usableWidth + A4.gap) / (size + A4.gap)));
      const rows = Math.max(1, Math.floor((usableHeight + A4.gap) / (size + A4.gap)));
      const usedWidth = columns * size + (columns - 1) * A4.gap;
      const usedHeight = rows * size + (rows - 1) * A4.gap;
      return {
        columns,
        rows,
        capacity: columns * rows,
        startX: (A4.width - usedWidth) / 2,
        startY: (A4.height - usedHeight) / 2
      };
    }

    function emptyPage() {
      return { slots: Array(calculateLayout().capacity).fill(null) };
    }

    function allPlacedIds() {
      return state.pages.flatMap(page => page.slots).filter(Boolean);
    }

    function placedCounts() {
      return allPlacedIds().reduce((counts, id) => {
        counts.set(id, (counts.get(id) || 0) + 1);
        return counts;
      }, new Map());
    }

    function repackPages() {
      const used = allPlacedIds();
      const capacity = calculateLayout().capacity;
      const pageCount = Math.max(1, Math.ceil(used.length / capacity));
      state.pages = Array.from({ length: pageCount }, (_, pageIndex) => ({
        slots: Array.from({ length: capacity }, (_, slotIndex) => used[pageIndex * capacity + slotIndex] || null)
      }));
      state.activeTarget = null;
      render();
    }

    function setSize(value) {
      const parsed = Math.min(80, Math.max(15, Number(value) || 30));
      state.size = Math.round(parsed * 2) / 2;
      repackPages();
    }

    function renderCatalog() {
      const query = state.search.trim().toLocaleLowerCase('pl');
      const counts = placedCounts();
      const items = LABELS.filter(label => {
        const matchesQuery = !query || label.name.toLocaleLowerCase('pl').includes(query);
        const matchesCategory = state.category === 'Wszystkie' || label.category === state.category;
        return matchesQuery && matchesCategory;
      });
      els.catalog.innerHTML = '';
      if (!items.length) {
        els.catalog.innerHTML = '<p class="catalog-empty">Nie znaleziono takiej etykiety.</p>';
        return;
      }
      const fragment = document.createDocumentFragment();
      items.forEach(label => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'label-card';
        button.dataset.labelId = label.id;
        const count = counts.get(label.id) || 0;
        button.title = count ? `${label.name} — już w arkuszu: ${count}` : `Dodaj: ${label.name}`;
        button.setAttribute('aria-label', count ? `${label.name}. Dodano do wydruku: ${count}. Kliknij, aby dodać kolejną.` : `Dodaj etykietę: ${label.name}`);
        button.innerHTML = `<img src="${label.thumb || label.src}" alt="Podgląd etykiety ${escapeHtml(label.name)}" loading="lazy"><span><strong>${escapeHtml(label.name)}</strong><small>${state.activeTarget ? 'Wstaw w wybrane pole' : 'Dodaj do arkusza'}</small></span>${count ? `<span class="usage-badge" aria-hidden="true">×${count}</span>` : ''}`;
        fragment.appendChild(button);
      });
      els.catalog.appendChild(fragment);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    }

    function slotPosition(index, layout) {
      const column = index % layout.columns;
      const row = Math.floor(index / layout.columns);
      return {
        x: layout.startX + column * (state.size + A4.gap),
        y: layout.startY + row * (state.size + A4.gap)
      };
    }

    function renderPages() {
      const layout = calculateLayout();
      els.pages.innerHTML = '';
      const fragment = document.createDocumentFragment();
      state.pages.forEach((page, pageIndex) => {
        const occupied = page.slots.filter(Boolean);
        const article = document.createElement('article');
        article.className = 'page-card';
        const names = occupied.map(id => labelMap.get(id)?.name).filter(Boolean);
        article.innerHTML = `
          <div class="page-header">
            <div><h3>Strona ${pageIndex + 1}</h3><span>${occupied.length} z ${layout.capacity} pól zajętych</span></div>
            <div class="page-actions">
              <button class="icon-btn delete-page" type="button" data-page="${pageIndex}" aria-label="Usuń stronę ${pageIndex + 1}" title="Usuń stronę">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="paper-wrap"><div class="paper" data-page="${pageIndex}"></div></div>
          <details class="page-summary" ${occupied.length ? 'open' : ''}>
            <summary>Etykiety na tej stronie</summary>
            <p class="${names.length ? '' : 'empty-summary'}">${names.length ? names.map(escapeHtml).join(' · ') : 'Strona jest pusta.'}</p>
          </details>`;

        const paper = article.querySelector('.paper');
        page.slots.forEach((labelId, slotIndex) => {
          const position = slotPosition(slotIndex, layout);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'slot';
          if (state.activeTarget?.pageIndex === pageIndex && state.activeTarget?.slotIndex === slotIndex) button.classList.add('active');
          button.dataset.page = pageIndex;
          button.dataset.slot = slotIndex;
          button.style.left = `${position.x / A4.width * 100}%`;
          button.style.top = `${position.y / A4.height * 100}%`;
          button.style.width = `${state.size / A4.width * 100}%`;
          button.style.height = `${state.size / A4.height * 100}%`;
          if (labelId) {
            const label = labelMap.get(labelId);
            button.setAttribute('aria-label', `Edytuj pole ${slotIndex + 1}: ${label.name}`);
            button.title = `${label.name} — kliknij, aby edytować`;
            button.innerHTML = `<img src="${label.src}" alt="">`;
          } else {
            button.setAttribute('aria-label', `Puste pole ${slotIndex + 1}. Kliknij, aby wybrać etykietę.`);
            button.title = 'Kliknij, aby wybrać etykietę';
            button.innerHTML = `<span class="slot-number"><span class="slot-plus">+</span>${slotIndex + 1}</span>`;
          }
          paper.appendChild(button);
        });
        fragment.appendChild(article);
      });
      els.pages.appendChild(fragment);
    }

    function renderStatus() {
      const layout = calculateLayout();
      const placed = allPlacedIds().length;
      els.layoutInfo.textContent = `${layout.columns} × ${layout.rows} · ${layout.capacity} pól`;
      els.workspaceStats.textContent = `${state.pages.length} ${state.pages.length === 1 ? 'strona' : state.pages.length < 5 ? 'strony' : 'stron'} · ${placed} ${placed === 1 ? 'etykieta' : placed < 5 ? 'etykiety' : 'etykiet'}`;
      if (state.activeTarget) {
        els.targetNote.hidden = false;
        els.targetNote.innerHTML = `Wybierz etykietę dla <strong>strony ${state.activeTarget.pageIndex + 1}, pola ${state.activeTarget.slotIndex + 1}</strong>.`;
      } else {
        els.targetNote.hidden = true;
      }
    }

    function render() {
      renderCatalog();
      renderPages();
      renderStatus();
    }

    function addLabel(labelId) {
      if (state.activeTarget) {
        const { pageIndex, slotIndex } = state.activeTarget;
        state.pages[pageIndex].slots[slotIndex] = labelId;
        state.activeTarget = null;
        render();
        showToast('Etykieta została wstawiona w wybrane pole.');
        return;
      }
      for (let pageIndex = 0; pageIndex < state.pages.length; pageIndex += 1) {
        const slotIndex = state.pages[pageIndex].slots.indexOf(null);
        if (slotIndex !== -1) {
          state.pages[pageIndex].slots[slotIndex] = labelId;
          render();
          showToast('Dodano etykietę do pierwszego wolnego pola.');
          return;
        }
      }
      state.pages.push(emptyPage());
      state.pages.at(-1).slots[0] = labelId;
      render();
      showToast('Dodano nową stronę i wstawiono etykietę.');
    }

    function chooseSlot(pageIndex, slotIndex) {
      const labelId = state.pages[pageIndex].slots[slotIndex];
      if (!labelId) {
        state.activeTarget = { pageIndex, slotIndex };
        render();
        els.searchInput.focus();
        return;
      }
      state.editingTarget = { pageIndex, slotIndex };
      const label = labelMap.get(labelId);
      els.modalImage.src = label.src;
      els.modalImage.alt = `Etykieta ${label.name}`;
      els.modalTitle.textContent = label.name;
      els.modalPosition.textContent = `Strona ${pageIndex + 1}, pole ${slotIndex + 1}`;
      els.editModal.hidden = false;
      els.replaceBtn.focus();
    }

    function closeModal() {
      els.editModal.hidden = true;
      state.editingTarget = null;
    }

    function cropGeometry() {
      const size = els.cropCanvas.width;
      const radius = size * 0.44;
      const diameter = radius * 2;
      const baseScale = cropState.image
        ? Math.max(diameter / cropState.image.naturalWidth, diameter / cropState.image.naturalHeight)
        : 1;
      return { size, radius, diameter, center: size / 2, baseScale };
    }

    function clampCropOffsets() {
      if (!cropState.image) return;
      const { diameter, baseScale } = cropGeometry();
      const scale = baseScale * cropState.zoom;
      const maxX = Math.max(0, (cropState.image.naturalWidth * scale - diameter) / 2);
      const maxY = Math.max(0, (cropState.image.naturalHeight * scale - diameter) / 2);
      cropState.offsetX = Math.max(-maxX, Math.min(maxX, cropState.offsetX));
      cropState.offsetY = Math.max(-maxY, Math.min(maxY, cropState.offsetY));
    }

    function drawCropPreview() {
      if (!cropState.image) return;
      clampCropOffsets();
      const canvas = els.cropCanvas;
      const context = canvas.getContext('2d');
      const { size, radius, center, baseScale } = cropGeometry();
      const scale = baseScale * cropState.zoom;
      const width = cropState.image.naturalWidth * scale;
      const height = cropState.image.naturalHeight * scale;
      const x = center - width / 2 + cropState.offsetX;
      const y = center - height / 2 + cropState.offsetY;

      context.clearRect(0, 0, size, size);
      context.fillStyle = '#cfc7bd';
      context.fillRect(0, 0, size, size);
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(cropState.image, x, y, width, height);
      context.save();
      context.fillStyle = 'rgba(29, 20, 16, .62)';
      context.beginPath();
      context.rect(0, 0, size, size);
      context.arc(center, center, radius, 0, Math.PI * 2, true);
      context.fill('evenodd');
      context.restore();
      context.beginPath();
      context.arc(center, center, radius, 0, Math.PI * 2);
      context.lineWidth = 8;
      context.strokeStyle = '#fff';
      context.stroke();
      context.lineWidth = 3;
      context.strokeStyle = '#7b2f20';
      context.stroke();
    }

    function closeImportModal() {
      els.importModal.hidden = true;
      els.imageFileInput.value = '';
      cropState.image = null;
      cropState.dragStart = null;
      if (cropState.objectUrl) URL.revokeObjectURL(cropState.objectUrl);
      cropState.objectUrl = null;
      els.cropStage.classList.remove('dragging');
    }

    function openImportModal(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Wybierz plik graficzny.');
        return;
      }
      if (cropState.objectUrl) URL.revokeObjectURL(cropState.objectUrl);
      cropState.objectUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        cropState.image = image;
        cropState.zoom = 1;
        cropState.offsetX = 0;
        cropState.offsetY = 0;
        els.cropZoom.value = '1';
        els.cropZoomValue.textContent = '100%';
        els.customLabelName.value = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
        els.importModal.hidden = false;
        drawCropPreview();
        els.customLabelName.focus();
      };
      image.onerror = () => {
        closeImportModal();
        showToast('Nie udało się odczytać obrazu.');
      };
      image.src = cropState.objectUrl;
    }

    function croppedImageDataUrl() {
      const output = document.createElement('canvas');
      output.width = 945;
      output.height = 945;
      const context = output.getContext('2d');
      const { diameter, baseScale } = cropGeometry();
      const previewToOutput = output.width / diameter;
      const imageScale = baseScale * cropState.zoom * previewToOutput;
      const width = cropState.image.naturalWidth * imageScale;
      const height = cropState.image.naturalHeight * imageScale;
      const x = output.width / 2 - width / 2 + cropState.offsetX * previewToOutput;
      const y = output.height / 2 - height / 2 + cropState.offsetY * previewToOutput;

      context.clearRect(0, 0, output.width, output.height);
      context.save();
      context.beginPath();
      context.arc(output.width / 2, output.height / 2, output.width / 2, 0, Math.PI * 2);
      context.clip();
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(cropState.image, x, y, width, height);
      context.restore();
      return output.toDataURL('image/png');
    }

    function confirmCustomLabel() {
      if (!cropState.image) return;
      const name = els.customLabelName.value.trim() || 'Własna etykieta';
      const label = {
        id: `custom-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        name,
        category: 'Własne',
        src: croppedImageDataUrl(),
        width: 945,
        dpi: 300,
        custom: true
      };
      LABELS.unshift(label);
      labelMap.set(label.id, label);
      state.category = 'Wszystkie';
      closeImportModal();
      initializeCategories();
      addLabel(label.id);
      showToast('Własna etykieta została dodana do arkusza.');
    }

    function deletePage(pageIndex) {
      const occupied = state.pages[pageIndex].slots.some(Boolean);
      if (occupied && !window.confirm(`Usunąć stronę ${pageIndex + 1} wraz z umieszczonymi na niej etykietami?`)) return;
      state.pages.splice(pageIndex, 1);
      if (!state.pages.length) state.pages.push(emptyPage());
      state.activeTarget = null;
      render();
    }

    let toastTimer;
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
    }

    function loadImage(src) {
      if (imageCache.has(src)) return imageCache.get(src);
      const promise = new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function dataUrlToBytes(dataUrl) {
      const binary = atob(dataUrl.split(',')[1]);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    function asciiBytes(text) {
      return new TextEncoder().encode(text);
    }

    function buildPdf(jpegs, width, height) {
      const objects = new Map();
      const pageRefs = [];
      const pageWidth = 595.28;
      const pageHeight = 841.89;
      objects.set(1, { text: '<< /Type /Catalog /Pages 2 0 R >>' });
      jpegs.forEach((jpeg, index) => {
        const pageObject = 3 + index * 3;
        const contentObject = pageObject + 1;
        const imageObject = pageObject + 2;
        pageRefs.push(`${pageObject} 0 R`);
        objects.set(pageObject, { text: `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im0 ${imageObject} 0 R >> >> /Contents ${contentObject} 0 R >>` });
        const drawing = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Im0 Do\nQ\n`;
        objects.set(contentObject, { stream: asciiBytes(drawing), dictionary: '' });
        objects.set(imageObject, {
          stream: jpeg,
          dictionary: `/Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`
        });
      });
      objects.set(2, { text: `<< /Type /Pages /Kids [${pageRefs.join(' ')}] /Count ${jpegs.length} >>` });

      const chunks = [new Uint8Array([37,80,68,70,45,49,46,52,10,37,255,255,255,255,10])];
      const offsets = [0];
      let byteLength = chunks[0].length;
      const objectCount = 2 + jpegs.length * 3;
      for (let objectNumber = 1; objectNumber <= objectCount; objectNumber += 1) {
        offsets[objectNumber] = byteLength;
        const object = objects.get(objectNumber);
        const header = asciiBytes(`${objectNumber} 0 obj\n`);
        chunks.push(header); byteLength += header.length;
        if (object.stream) {
          const prefix = asciiBytes(`<< ${object.dictionary} /Length ${object.stream.length} >>\nstream\n`);
          const suffix = asciiBytes('\nendstream\nendobj\n');
          chunks.push(prefix, object.stream, suffix);
          byteLength += prefix.length + object.stream.length + suffix.length;
        } else {
          const body = asciiBytes(`${object.text}\nendobj\n`);
          chunks.push(body); byteLength += body.length;
        }
      }
      const xrefOffset = byteLength;
      let xref = `xref\n0 ${objectCount + 1}\n0000000000 65535 f \n`;
      for (let objectNumber = 1; objectNumber <= objectCount; objectNumber += 1) {
        xref += `${String(offsets[objectNumber]).padStart(10, '0')} 00000 n \n`;
      }
      xref += `trailer\n<< /Size ${objectCount + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
      chunks.push(asciiBytes(xref));
      return new Blob(chunks, { type: 'application/pdf' });
    }

    async function exportPdf() {
      const printablePages = state.pages.filter(page => page.slots.some(Boolean));
      if (!printablePages.length) {
        showToast('Dodaj przynajmniej jedną etykietę przed eksportem.');
        return;
      }
      els.exportBtn.disabled = true;
      const originalText = els.exportBtn.innerHTML;
      els.exportBtn.textContent = 'Tworzenie PDF…';
      try {
        const canvasWidth = 2480;
        const canvasHeight = 3508;
        const scaleX = canvasWidth / A4.width;
        const scaleY = canvasHeight / A4.height;
        const layout = calculateLayout();
        const jpegs = [];
        for (const page of printablePages) {
          const canvas = document.createElement('canvas');
          canvas.width = canvasWidth;
          canvas.height = canvasHeight;
          const context = canvas.getContext('2d', { alpha: false });
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvasWidth, canvasHeight);
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = 'high';
          for (let slotIndex = 0; slotIndex < page.slots.length; slotIndex += 1) {
            const labelId = page.slots[slotIndex];
            if (!labelId) continue;
            const label = labelMap.get(labelId);
            const image = await loadImage(label.src);
            const position = slotPosition(slotIndex, layout);
            const x = position.x * scaleX;
            const y = position.y * scaleY;
            const width = state.size * scaleX;
            const height = state.size * scaleY;
            context.save();
            context.beginPath();
            context.ellipse(x + width / 2, y + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
            context.clip();
            context.drawImage(image, x, y, width, height);
            context.restore();
          }
          jpegs.push(dataUrlToBytes(canvas.toDataURL('image/jpeg', 0.96)));
          await new Promise(resolve => setTimeout(resolve, 0));
        }
        const pdf = buildPdf(jpegs, canvasWidth, canvasHeight);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(pdf);
        link.download = `etykiety-przyprawy-${String(state.size).replace('.', '_')}mm-${printablePages.length}str.pdf`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        showToast('PDF został wygenerowany.');
      } catch (error) {
        console.error(error);
        showToast('Nie udało się utworzyć PDF. Spróbuj ponownie.');
      } finally {
        els.exportBtn.disabled = false;
        els.exportBtn.innerHTML = originalText;
      }
    }

    function initializeCategories() {
      const categories = ['Wszystkie', ...new Set(LABELS.map(label => label.category))];
      els.categoryFilter.innerHTML = categories.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('');
      if (!categories.includes(state.category)) state.category = 'Wszystkie';
      els.categoryFilter.value = state.category;
    }

    function cropPointerPosition(event) {
      const bounds = els.cropCanvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * els.cropCanvas.width / bounds.width,
        y: (event.clientY - bounds.top) * els.cropCanvas.height / bounds.height
      };
    }

    els.catalog.addEventListener('click', event => {
      const card = event.target.closest('.label-card');
      if (card) addLabel(card.dataset.labelId);
    });
    els.pages.addEventListener('click', event => {
      const slot = event.target.closest('.slot');
      if (slot) chooseSlot(Number(slot.dataset.page), Number(slot.dataset.slot));
      const deleteButton = event.target.closest('.delete-page');
      if (deleteButton) deletePage(Number(deleteButton.dataset.page));
    });
    els.searchInput.addEventListener('input', () => { state.search = els.searchInput.value; renderCatalog(); });
    els.categoryFilter.addEventListener('change', () => { state.category = els.categoryFilter.value; renderCatalog(); });
    els.sizePreset.addEventListener('change', () => {
      const custom = els.sizePreset.value === 'custom';
      els.customSizeField.hidden = !custom;
      els.layoutInfoField.style.gridColumn = custom ? '1 / -1' : 'auto';
      if (custom) {
        els.customSize.focus();
        setSize(els.customSize.value);
      } else {
        setSize(els.sizePreset.value);
      }
    });
    els.customSize.addEventListener('change', () => setSize(els.customSize.value));
    els.addPageBtn.addEventListener('click', () => { state.pages.push(emptyPage()); render(); });
    els.exportBtn.addEventListener('click', exportPdf);
    els.importImageBtn.addEventListener('click', () => els.imageFileInput.click());
    els.imageFileInput.addEventListener('change', () => openImportModal(els.imageFileInput.files[0]));
    els.closeImportBtn.addEventListener('click', closeImportModal);
    els.cancelImportBtn.addEventListener('click', closeImportModal);
    els.confirmImportBtn.addEventListener('click', confirmCustomLabel);
    els.importModal.addEventListener('click', event => { if (event.target === els.importModal) closeImportModal(); });
    els.cropZoom.addEventListener('input', () => {
      cropState.zoom = Number(els.cropZoom.value);
      els.cropZoomValue.textContent = `${Math.round(cropState.zoom * 100)}%`;
      drawCropPreview();
    });
    els.cropCanvas.addEventListener('pointerdown', event => {
      if (!cropState.image) return;
      const point = cropPointerPosition(event);
      cropState.dragStart = { pointerId: event.pointerId, x: point.x, y: point.y, offsetX: cropState.offsetX, offsetY: cropState.offsetY };
      els.cropCanvas.setPointerCapture(event.pointerId);
      els.cropStage.classList.add('dragging');
    });
    els.cropCanvas.addEventListener('pointermove', event => {
      if (!cropState.dragStart || cropState.dragStart.pointerId !== event.pointerId) return;
      const point = cropPointerPosition(event);
      cropState.offsetX = cropState.dragStart.offsetX + point.x - cropState.dragStart.x;
      cropState.offsetY = cropState.dragStart.offsetY + point.y - cropState.dragStart.y;
      drawCropPreview();
    });
    const finishCropDrag = event => {
      if (!cropState.dragStart || cropState.dragStart.pointerId !== event.pointerId) return;
      cropState.dragStart = null;
      els.cropStage.classList.remove('dragging');
      if (els.cropCanvas.hasPointerCapture(event.pointerId)) els.cropCanvas.releasePointerCapture(event.pointerId);
    };
    els.cropCanvas.addEventListener('pointerup', finishCropDrag);
    els.cropCanvas.addEventListener('pointercancel', finishCropDrag);
    els.closeModalBtn.addEventListener('click', closeModal);
    els.editModal.addEventListener('click', event => { if (event.target === els.editModal) closeModal(); });
    els.replaceBtn.addEventListener('click', () => {
      if (!state.editingTarget) return;
      state.activeTarget = { ...state.editingTarget };
      closeModal();
      render();
      els.searchInput.focus();
    });
    els.removeBtn.addEventListener('click', () => {
      if (!state.editingTarget) return;
      const { pageIndex, slotIndex } = state.editingTarget;
      state.pages[pageIndex].slots[slotIndex] = null;
      closeModal();
      render();
      showToast('Etykieta została usunięta z pola.');
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (!els.importModal.hidden) closeImportModal();
      else if (!els.editModal.hidden) closeModal();
    });

    initializeCategories();
    state.pages = [emptyPage()];
    render();
  </script>
</body>
</html>
